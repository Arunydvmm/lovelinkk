services:
  - type: web
    name: lovelink-builder
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSCODE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: lovelink-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
